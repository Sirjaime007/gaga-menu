<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GaGa | Comida de Calidad Auténtica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; }
    body { 
        margin: 0; padding: 0; font-family: 'Inter', sans-serif; 
        background-color: #f7b700; /* Amarillo de la imagen */
        color: #1a1a1a; 
    }

    .gaga-nav { display: flex; justify-content: space-between; align-items: center; padding: 1.5rem 2rem; }
    .gaga-logo { font-size: 2.5rem; font-weight: 900; letter-spacing: -2px; }
    .nav-actions { display: flex; gap: 15px; }
    
    .btn { font-weight: 800; font-size: 0.9rem; cursor: pointer; text-transform: uppercase; padding: 10px 24px; border-radius: 30px; border: none; }
    .btn-pedir { background-color: #2b7a65; color: white; } /* Verde del sillón */
    .btn-menu { background-color: transparent; border: 2px solid #1a1a1a; color: #1a1a1a; }

    .gaga-main { padding: 2rem; max-width: 1200px; margin: 0 auto; display: flex; gap: 40px; align-items: center; flex-wrap: wrap; }
    .hero-text { flex: 1; min-width: 300px; }
    .hero-image { flex: 1; min-width: 300px; }
    .hero-image img { width: 100%; border-radius: 20px; box-shadow: 10px 10px 0px rgba(0,0,0,0.1); display: block; }

    .titular { font-size: clamp(3rem, 7vw, 5.5rem); font-weight: 900; line-height: 1; margin: 0 0 2rem 0; text-transform: uppercase; }
    
    .btn-principal { background-color: #2b7a65; color: white; padding: 16px 32px; border-radius: 40px; font-size: 1.2rem; margin-bottom: 3rem; display: inline-block; }

    .lote-info { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 10px; font-weight: 900; text-transform: uppercase; }
    .stock-numeros { font-size: 3rem; line-height: 1; }
    .stock-label { font-size: 1rem; margin-left: 8px; }

    .progress-bar-container { width: 100%; height: 20px; background-color: rgba(0,0,0,0.1); border-radius: 10px; overflow: hidden; margin-bottom: 1rem; }
    .progress-bar-fill { height: 100%; background-color: #1a1a1a; width: 0%; transition: width 1s ease; }

    .entrega-texto { font-size: 0.9rem; font-weight: 700; }
  </style>
</head>
<body>
  
  <header class="gaga-nav">
    <div class="gaga-logo">GaGa</div>
    <div class="nav-actions">
        <button class="btn btn-pedir">Pedir</button>
        <button class="btn btn-menu">Menú</button>
    </div>
  </header>

  <main class="gaga-main">
    <div class="hero-text">
        <h1 class="titular">MENOS BLA&nbsp;BLA.<br>MÁS GAGA.</h1>
        <button class="btn btn-principal">Quiero probarlo</button>

        <div class="lote-info">
            <span>LOTE 23/10</span>
            <div class="stock-numeros">
                <span id="stock-actual">0</span> / <span id="stock-total">50</span>
                <span class="stock-label">PEDIDOS</span>
            </div>
        </div>
        
        <div class="progress-bar-container">
            <div id="barra-progreso" class="progress-bar-fill"></div>
        </div>

        <div class="entrega-texto">
            Entrega: Viernes, 23 De Octubre · <span id="estado-texto">Quedan lugares</span>
        </div>
    </div>
    
    <div class="hero-image">
        <!-- Aquí carga la imagen que subiste a GitHub -->
        <img src="foto-gaga.jpg" alt="Estilo GaGa">
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
        const TOTAL_MENUS = 50; 
        const MENUS_VENDIDOS = 38; 

        document.getElementById('stock-actual').innerText = MENUS_VENDIDOS;
        document.getElementById('stock-total').innerText = TOTAL_MENUS;
        
        let porcentaje = (MENUS_VENDIDOS / TOTAL_MENUS) * 100;
        setTimeout(() => { document.getElementById('barra-progreso').style.width = Math.min(porcentaje, 100) + '%'; }, 300);

        if (MENUS_VENDIDOS >= TOTAL_MENUS) {
            document.getElementById('estado-texto').innerText = 'agotado por esta semana';
        }
    });
  </script>
</body>
</html>
